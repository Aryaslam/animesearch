<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hasil Pencarian - Anime Search</title>
        <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
        <link rel="stylesheet" href="./components.css">
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>

        <header class="search-container">
            <form class="search-bar" id="search-form" action="search.html" method="GET">
                <input type="text" name="q" id="search-input" placeholder="Search anime..." aria-label="Search anime" required />
                <button type="submit" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path d="M10 2a8 8 0 015.29 13.71l4.5 4.5a1 1 0 01-1.42 1.42l-4.5-4.5A8 8 0 1110 2zm0 2a6 6 0 100 12 6 6 0 000-12z"/>
                    </svg>
                </button>
            </form>
        </header>

        <main class="main-content">
            <div style="margin-bottom: 20px;">
                <a href="index.html" style="color: #46ACC0; text-decoration: none; font-weight: bold;">&larr; Kembali ke Home</a>
            </div>
            <!-- GRID RESULT -->
            <section id="results-section" class="results-grid"></section>
        </main>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="search.js"></script>
    </body>
</html>
